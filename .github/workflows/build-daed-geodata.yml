name: Build daed geodata

on:
  push:
    branches: [main]
    paths:
      - "daed/*.list"
      - ".github/workflows/build-daed-geodata.yml"
      - ".github/workflows/build-daed-geodata.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-daed-geodata
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build geodata files
        run: python .github/workflows/build-daed-geodata.py daed/direct-domain.list daed/direct-ip.list daed/proxy-domain.list daed/proxy-ip.list dist/custom.dat dist/custom-ip.dat

      - name: Commit built geodata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/custom.dat dist/custom-ip.dat
          if git diff --cached --quiet; then
            echo "No geodata changes"
          else
            git commit -m "build daed geodata"
            git pull --rebase origin main
            git push
          fi
